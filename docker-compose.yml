# Local PostgreSQL for development. Start with:  docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: careroute-postgres
    environment:
      POSTGRES_DB: careroute
      POSTGRES_USER: careroute
      POSTGRES_PASSWORD: careroute
    ports:
      - "5432:5432"
    volumes:
      - careroute-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careroute -d careroute"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  careroute-pgdata:
